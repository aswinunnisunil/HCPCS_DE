
services:
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile

    container_name: hcpcs_airflow

    command: standalone

    ports:
      - "8081:8080"

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "2"
      DB_HOST: host.docker.internal

    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - ./logs:/opt/airflow/logs

    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: hcpcs_metabase

    ports:
      - "3000:3000"

    environment:
      MB_DB_FILE: /metabase-data/metabase.db

    volumes:
      - hcpcs_metabase_data:/metabase-data

    restart: unless-stopped

volumes:
  hcpcs_metabase_data:
    external: true
